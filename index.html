<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Header: balance display + theme toggle -->
    <header class="app-header">
      <div id="balance-display">
        <span class="balance-label">Total Spending</span>
        <span id="balance-amount">$0.00</span>
      </div>
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <!-- Spending limit warning banner -->
    <div id="limit-warning" hidden role="alert">
      ⚠️ You have exceeded your spending limit!
    </div>

    <main class="app-main">
      <!-- Expense input form -->
      <section class="form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Expense</h2>
        <form id="expense-form" novalidate>
          <div class="field-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              placeholder="e.g. Coffee"
              autocomplete="off"
            />
            <span id="item-name-error" class="error-msg" aria-live="polite" hidden></span>
          </div>

          <div class="field-group">
            <label for="amount">Amount</label>
            <input
              type="number"
              id="amount"
              name="amount"
              min="0.01"
              step="0.01"
              placeholder="0.00"
            />
            <span id="amount-error" class="error-msg" aria-live="polite" hidden></span>
          </div>

          <div class="field-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">-- Select category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span id="category-error" class="error-msg" aria-live="polite" hidden></span>
          </div>

          <button type="submit" id="submit-btn">Add Expense</button>
        </form>
      </section>

      <!-- Spending chart -->
      <section class="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending Breakdown</h2>
        <div class="chart-container">
          <canvas id="spending-chart" aria-label="Spending breakdown by category" hidden></canvas>
          <p id="chart-empty">No expenses to display yet.</p>
        </div>
      </section>

      <!-- Transaction list -->
      <section class="list-section" aria-labelledby="list-heading">
        <h2 id="list-heading">Transactions</h2>
        <div class="list-container">
          <ul id="transaction-list" aria-label="Transaction list">
            <!-- Transactions rendered here by app.js -->
          </ul>
        </div>
      </section>
    </main>

    <!-- Footer area: sort control + spending limit -->
    <footer class="app-footer">
      <div class="sort-control">
        <label for="sort-select">Sort by</label>
        <select id="sort-select">
          <option value="">Default</option>
          <option value="amount-asc">Amount: Low to High</option>
          <option value="amount-desc">Amount: High to Low</option>
          <option value="category-asc">Category: A–Z</option>
        </select>
      </div>

      <div class="limit-control">
        <label for="spending-limit">Spending Limit</label>
        <input
          type="number"
          id="spending-limit"
          min="0.01"
          step="0.01"
          placeholder="Set limit…"
        />
        <span id="limit-error" class="error-msg" aria-live="polite" hidden></span>
      </div>
    </footer>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- App logic -->
    <script src="js/app.js" defer></script>
  </body>
</html>
